name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar versión del tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "El tag $RELEASE_TAG no coincide con la versión $expected_tag de package.json."
            exit 1
          fi

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --publish never
      - name: Guardar artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: parkingchia-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar certificado de macOS
        if: env.MAC_CSC_LINK != ''
        shell: bash
        run: echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run dist:mac -- --publish never
      - name: Guardar artefactos macOS
        uses: actions/upload-artifact@v4
        with:
          name: parkingchia-macos-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # Subir más de 600 MB puede tardar y la API de GitHub devuelve errores 500 intermitentes.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease_flag=""
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc) ]]; then
            prerelease_flag="--prerelease"
          fi

          # Un borrador de un intento anterior se reutiliza; una versión publicada nunca se reemplaza.
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "La versión $RELEASE_TAG ya está publicada; crea una versión nueva en lugar de reemplazar sus artefactos."
              exit 1
            fi
          else
            # El borrador es invisible para el actualizador hasta que tenga todos los archivos.
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Parking Chía ${RELEASE_TAG#v}" \
              $prerelease_flag
          fi

          for file in artifacts/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" "$file" --clobber; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "No fue posible subir $(basename "$file") después de 5 intentos."
                exit 1
              fi
              echo "Falló la subida de $(basename "$file") (intento $attempt); se reintenta."
              sleep $((attempt * 15))
            done
          done

          expected=$(ls artifacts | wc -l)
          uploaded=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [[ "$uploaded" != "$expected" ]]; then
            echo "El release tiene $uploaded archivos y se esperaban $expected."
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --draft=false $prerelease_flag
